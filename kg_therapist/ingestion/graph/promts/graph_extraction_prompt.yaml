batch_prompt: |
  You are a mental health knowledge extraction system.

  OUTPUT: Return ONLY a valid JSON array. First char '[', last char ']'.
  NO markdown, NO backticks.

  EXTRACT ONLY these mental health concepts:

  1. PROBLEMS (psychological phenomena)
     - anxiety, depression, PTSD, panic attacks, trauma, grief, loneliness,
       stress, burnout, emotional overwhelm
     - Label as: SYMPTOM or CONDITION

  2. TOPICS / ISSUES (broader contextual problems)
     - work stress, relationship issues, academic pressure, self-esteem issues,
       emotional burden, family conflict, caregiving stress
     - Label as: ISSUE

  3. SOLUTIONS (non-medication only)
     - therapy, counseling, mindfulness, grounding, journaling, coping skills,
       breathing exercises, meditation, emotional regulation, self-care,
       cognitive behavioral therapy, supportive counseling
     - Label as: COPING_STRATEGY or INTERVENTION

  4. STRESSORS (explicit only)
     - trauma, loss, work pressure, conflict, life changes
     - Label as: STRESSOR

  DO NOT EXTRACT:
  ❌ Medication  
  ❌ Physical symptoms (pain, headaches) unless explicitly caused by mental distress  
  ❌ Physical illnesses  
  ❌ Names, places, dates  
  ❌ Synonyms (choose ONE clinical term)

  CRITICAL RULES:

  1. ONE CONCEPT = ONE NODE
     - If multiple synonyms appear → extract only the most clinical term
       Example: "sad, down, depressed" → extract ONLY "depression"

  2. MENTAL HEALTH ONLY
     - "insomnia due to stress" → extract "stress"
     - "stress headaches" → extract "stress"
     - "back pain" → skip

  3. LIMIT PER TEXT BLOCK
     - Max 6 nodes
     - Max 10 edges
     - Quality over quantity

  RELATIONSHIPS (only if EXPLICIT in text):
  - TARGETS: solution addresses a problem ("therapy for anxiety")
  - ALLEVIATES: solution reduces symptoms ("breathing helps anxiety")
  - TREATED_BY: problem treated by intervention ("anxiety treated by therapy")
  - HELPED_BY: symptom helped by coping strategy ("stress helped by mindfulness")
  - MANAGED_BY: issue handled by strategy ("burnout managed by self-care")
  - SUGGESTS_STRATEGY: when the text explicitly recommends a strategy
  - REFERENCES_INTERVENTION: text mentions a professional intervention
  - WORSENED_BY: stressor worsens problem
  - TRIGGERED_BY: stressor causes problem
  - RELATED_TO: conceptual relation between problems

  NAMING RULES:
  - Lowercase, simple, shortest form
  - "cognitive behavioral therapy"
  - "mindfulness"
  - "anxiety"

  OUTPUT FORMAT:
  [
    {{
      "source_index": <int>,
      "nodes": [
        {{"name": "anxiety", "label": "SYMPTOM"}},
        {{"name": "mindfulness", "label": "COPING_STRATEGY"}}
      ],
      "edges": [
        {{"start": "mindfulness", "end": "anxiety", "type": "HELPED_BY"}}
      ]
    }}
  ]

  If no mental health content:
  {{"source_index": <int>, "nodes": [], "edges": []}}

  Text blocks:
  {text_block}

