  ⚠️ CRITICAL OUTPUT RULES: 
  - **ALL fields must be present in output** (including empathy_preamble_vi)
  - **empathy_preamble_vi**: String in VIETNAMESE, 1-2 sentences, validates user experience
  - **Lists must be arrays []**, tri-states must be "yes"/"no"/"unknown"
  - **"no/none" → STRING IN LIST**: medical_history=["no medical conditions"] NOT []
  - **Empty [] vs ["no"]**: [] = not asked, ["no..."] = user said no
  - **Follow-up questions**: Array of strings in **VIETNAMESE** (user's language)

  ========== MANDATORY FOLLOW-UP QUESTION GENERATION ==========
  
  🔴 **ABSOLUTE REQUIREMENT - FOLLOW-UP QUESTIONS FOR REQUIRED SLOTS**:
  
  **REQUIRED SLOTS** (DSM-5 diagnostic essentials - MUST be filled):
  
  # STAGE 1 - PRESENTING (3 slots):
  1. presenting_problem
  2. emotion
  3. primary_mood
  
  # STAGE 2 - TIMELINE (4 slots):
  4. onset
  5. duration
  6. frequency
  7. symptom_fluctuation
  
  # STAGE 3 - SEVERITY (3 slots):
  8. intensity
  9. distress_level
  10. stress_level
  
  # STAGE 4 - FUNCTIONING (4 slots):
  11. daily_functioning
  12. work_school_impact
  13. social_functioning
  14. self_care_functioning
  
  # STAGE 5 - CONTEXT (3 slots):
  15. trigger
  16. current_stressors
  17. recent_life_events
  
  # STAGE 6 - EXCLUSION (4 slots):
  18. substance_use_any
  19. medical_history_any
  20. medication_changes
  21. caffeine_nicotine_use
  
  # STAGE 7 - SUPPORT/COPING (2 slots):
  22. support_system
  23. coping_mechanisms
  
  # STAGE 8 - SCREENS (2 slots):
  24. mania_like_symptoms
  25. psychotic_like_symptoms
  
  **TOTAL: 25 REQUIRED SLOTS**
  
  **MANDATORY QUESTIONING RULES**: 
  
  🔴 **RULE 1 - NEVER EMPTY FOLLOW_UP_QUESTIONS IF REQUIRED SLOTS MISSING**:
  - If ANY required slot is empty ([]) or unknown → follow_up_questions MUST have at least 1 question
  - If follow_up_questions is empty BUT required slots are missing → YOU FAILED THE TASK
  
  🔴 **RULE 2 - STRICT LIMIT: 1-3 QUESTIONS PER TURN**:
  - **Minimum: 1 question** (if any required slot missing)
  - **Maximum: 3 questions** (absolutely no more, even if many slots missing)
  - Prioritize MOST CRITICAL missing slots (Stage 1-3 > Stage 4-5 > Stage 6-8)
  
  🔴 **RULE 3 - ALWAYS SPECIFIC, NEVER GENERIC**:
  - ✅ CORRECT: "Tình trạng này bắt đầu từ khi nào? (số ngày/tuần/tháng)"
  - ❌ WRONG: "Bạn có thể chia sẻ thêm chi tiết không?"
  - ❌ WRONG: "Kể thêm về tình huống của bạn"
  - Each question must target ONE specific slot
  
  🔴 **RULE 4 - PRIORITIZATION ORDER**:
  1. STAGE 1-2 (Presenting + Timeline): onset, duration, emotion, presenting_problem
  2. STAGE 3-4 (Severity + Functioning): intensity, distress_level, daily_functioning, work_school_impact
  3. STAGE 5-6 (Context + Exclusion): trigger, substance_use_any, medical_history_any
  4. STAGE 7-8 (Support + Screens): support_system, mania_like_symptoms
  
  **ENFORCEMENT CHECKLIST** (check before returning JSON):
  [ ] Count missing required slots → Is count > 0?
  [ ] If YES → Is follow_up_questions.length >= 1 AND <= 3?
  [ ] Are ALL questions SPECIFIC to a missing slot (not generic)?
  [ ] Did I prioritize Stage 1-3 slots over others?
  [ ] Is each question in VIETNAMESE?
  
  **EXAMPLES OF MANDATORY ENFORCEMENT**:
  , no empathy):
  ```json
  {
    "empathy_preamble_vi": "Bạn có thể chia sẻ thêm không?",
    "slots": {"emotion": [], "onset": [], "duration": []},
    "follow_up_questions": ["Bạn có thể chia sẻ thêm chi tiết về tình huống của bạn không?"]
  }
  ```
  WHY WRONG: empathy_preamble is a question (not allowed), follow-up question is generic
  WHY WRONG: Generic question doesn't address specific missing slots
  
  ❌ WRONG (too many questions):
  ```json
  {
    "slots": {"emotion": [], "onset": [], "duration": [], "intensity": [], "trigger": []},
    "follow_up_questions": [
      "Bạn cảm thấy cảm xúc gì?",
      "Bắt đầu từ khi nào?",
      "Kéo dài bao lâu?",
      "Mức độ nghiêm trọng?",
      "Nguyên nhân gì?"
    ]
  }
  ```
  WHY WRONG: 5 questions exceed maximum limit of 3 per turn
  
  ✅ CORRECT (1-3 specific questions, prioritized):
  ```json
  {
    "slots": {"emotion": [], "onset": [], "duration": [], "intensity": [], "trigger": []},
    "follow_up_questions": [
      "Bạn đang cảm thấy cảm xúc gì cụ thể? (lo lắng, buồn bã, cáu gắt, v.v.)",
      "Tình trạng này bắt đầu từ khi nào? (số ngày, tuần, tháng cụ thể)",
      "Đã kéo dài bao lâu rồi? (số ngày, tuần, tháng liên tục)"
    ]
  }
  ```
  WHY CORRECT: 3 questions max, prioritized Stage 1-2 slots (emotion, onset, duration over intensity, trigger)
  
  ❌ WRONG (empty follow_up_questions with missing required slots):
  ```json
  {
    "slots": {"emotion": ["anxious"], "onset": [], "duration": [], "intensity": []},
    "follow_up_questions": []
  }
  ```
  WHY WRONG: Required slots (onset, duration, intensity) missing but no follow-up questions
  
  ✅ CORRECT (questions for prioritized missing required slots):
  ```json
  {
    "slots": {"emotion": ["anxious"], "onset": [], "duration": [], "intensity": []},
    "follow_up_questions": [
      "Cảm giác lo lắng này bắt đầu từ khi nào?",
      "Đã kéo dài bao lâu rồi?",
      "Mức độ lo lắng nghiêm trọng ra sao? (nhẹ, trung bình, nặng)"
    ]
  }
  ```
  WHY CORRECT: 3 specific questions for onset, duration, intensity (prioritized)
  
  ✅ CORRECT (only 1 question if only 1 critical slot missing):
  ```json
  {
    "slots": {"emotion": ["sad"], "onset": ["2 weeks ago"], "duration": [], "intensity": ["moderate"]},
    "follow_up_questions": [
      "Tình trạng này đã kéo dài liên tục trong 2 tuần hay có gián đoạn?"
    ]
  }
  ```
  WHY CORRECT: Only duration missing from Stage 1-2, asked 1 specific question
  
  🔴 **FINAL PRE-OUTPUT VALIDATION**:
  ```
  missing_required_count = count(required_slots where value is [] or "unknown")
  
  IF missing_required_count > 0:
      ASSERT len(follow_up_questions) >= 1
      ASSERT len(follow_up_questions) <= 3
      ASSERT all questions are SPECIFIC (not generic)
      ASSERT questions target highest priority missing slots
  ELSE:
      follow_up_questions can be []
  ```
