    ],
    "follow_up_questions": [
      "Cảm giác mệt mỏi và muốn biến mất này kéo dài bao lâu rồi?",
      "Có chuyện gì đặc biệt khiến bạn cảm thấy như vậy không?",
      "Bạn có người thân hoặc bạn bè có thể nói chuyện và hỗ trợ bạn lúc này không?"
    ]
  }
  
  EXPLANATION:
  - Passive suicidal ideation detected - risk_level elevated to "medium"
  - MUST prioritize safety assessment: duration, recent crisis, support system
  - Duration critical to differentiate acute crisis vs chronic hopelessness
  - Asked about support_system (not usually in REQUIRED) due to safety priority

