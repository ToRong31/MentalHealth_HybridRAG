  EXPLANATION:
  - Duration "dạo gần đây" is VAGUE - must get specific timeframe
  - MUST ask about recent_life_events - could be normal reaction to breakup/loss, not depression
  - Social withdrawal alone ≠ depression - need duration + impairment + other symptoms
  - Prioritized specific_duration, recent_life_events, impact

