  EXAMPLE 6 - Duration Extraction from Noisy Response (CRITICAL EXAMPLE):
  CONTEXT: Bot asked "Cảm giác lo lắng này kéo dài bao lâu rồi?"
  USER: "Dạ, chắc cũng mới tầm một tuần nay thôi bác sĩ, từ khi em bắt đầu phải chuẩn bị tài liệu cho buổi thuyết trình đó ạ."
  
  OUTPUT:
  {
    "slots": {
      "emotion": ["lo lắng"],  // from context
      "primary_mood": "lo lắng",
      "intensity": null,
      "trigger": "chuẩn bị tài liệu cho buổi thuyết trình",  // ⭐ EXTRACTED
      "duration": "một tuần nay",  // ⭐ CRITICAL: MUST extract "tầm một tuần nay"
      "impact": null,
      "risk_level": "unknown",
      "need": null,
      "physical_symptoms": [],
      "sleep_quality": null,
      "sleep_duration": null,
      "energy_level": null,
      "appetite_changes": null,
      "daily_functioning": null,
      "work_school_impact": null,
      "support_system": null,
      "family_support": null,
      "friend_support": null,
      "social_isolation": null,
      "social_withdrawal": null,
      "coping_mechanisms": [],
      "coping_effectiveness": null,
      "current_stressors": ["thuyết trình công việc"],
      "stress_level": null,
      "suicidal_ideation": null,
      "self_harm_thoughts": null,
      "current_treatment": null,
      "medication": null,
      "substance_use": null,
      "medical_history": null,
      "recent_life_events": "chuẩn bị thuyết trình",
      "symptom_fluctuation": null,
      "history_of_trauma": null,
      "diagnostic_confidence": "low",
      "potential_differentials": ["work stress", "performance anxiety"],
      "duration_certainty": "approximate"  // "tầm" = approximate
    },
    "missing_slots": ["intensity", "impact", "stress_level"],
    "relevant_missing_slots": ["intensity", "impact"],
    "follow_up_questions": [
      "Cảm giác lo lắng này mạnh đến mức nào? Nhẹ, trung bình hay nghiêm trọng?",
      "Nó có ảnh hưởng đến công việc hoặc sinh hoạt hằng ngày của bạn không?"
    ]
  }
  
  EXPLANATION:
  - ⭐ CRITICAL: Duration "tầm một tuần nay" successfully extracted despite noise ("Dạ", "chắc cũng mới", "bác sĩ", "ạ")
  - Also extracted trigger from same sentence: "chuẩn bị tài liệu cho buổi thuyết trình"
  - Duration only 1 week + trigger is work presentation → likely acute work stress, NOT disorder
  - recent_life_events also captured to differentiate stress vs disorder
  - duration_certainty marked "approximate" because of "tầm" (approximately)

  ========== IMPORTANT NOTES ==========
  
  - **ALL FOLLOW-UP QUESTIONS MUST BE IN VIETNAMESE (Tiếng Việt)**
  - missing_slots = ALL slots that are null/empty/not mentioned
  - relevant_missing_slots = PRIORITIZE REQUIRED_SLOTS + DIFFERENTIAL first, then other semantically related slots
  - follow_up_questions = Focus on REQUIRED_SLOTS + DIFFERENTIAL first (max 3 questions)
  - **REQUIRED_SLOTS**: emotion, duration (specific), impact, intensity, recent_life_events
  - **DIFFERENTIAL SLOTS**: substance_use, medical_history (especially if physical symptoms present)
  - Questions should be empathetic, natural, and flow from the conversation
  - For very brief inputs, extract what you can and ask 1-2 questions about REQUIRED_SLOTS
  - Think like a therapist: what CORE information is needed to understand this situation?
  - Complete REQUIRED_SLOTS and DIFFERENTIAL before asking about other details
  - **DURATION QUALITY CHECK**: Reject vague terms like "lately", "dạo này", "gần đây" - ask for specific timeframe
  - **DIFFERENTIAL PRIORITY**: If physical symptoms → MUST ask medical_history + substance_use FIRST
  - **AVOID PREMATURE DIAGNOSIS**: System should focus on support/coping unless clear disorder criteria met

