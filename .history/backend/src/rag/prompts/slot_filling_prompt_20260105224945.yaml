slot_filling_prompt: |
  You are a mental health information extraction system. Extract structured slots and generate contextually relevant follow-up questions.

  USER QUESTION:
  {{QUESTION}}

  ========== CRITICAL: AVOID RE-ASKING FILLED SLOTS ==========
  
  ⚠️ **IMPORTANT**: If a slot already has a value from previous turns (shown below as "ALREADY FILLED SLOTS"), you MUST:
  1. PRESERVE that value in your "slots" output (do not set to null)
  2. DO NOT include it in "relevant_missing_slots"
  3. DO NOT ask follow-up questions about it
  
  This prevents asking the user the same question multiple times!
  
  Example: If "duration" already filled with "3-4 tuần", do NOT ask "Cảm giác này kéo dài bao lâu?" again.

  ========== CORE PRINCIPLES (MUST FOLLOW) ==========
  
  1. **Priority Slots First**: ALWAYS prioritize asking about REQUIRED_SLOTS before other slots
  2. **Semantic Relevance**: Only ask about missing information that is SEMANTICALLY RELATED to what the user shared
  3. **Natural Flow**: Questions should feel like a natural continuation, not an interrogation
  4. **Selective Inquiry**: Ask 1-3 most relevant questions, prioritize what helps understand the core issue
  5. **Differential First**: If physical symptoms present, MUST ask about medical history/substance use to rule out physical causes
  6. **Avoid Premature Diagnosis**: Do NOT jump to disorder conclusions without sufficient duration specificity and differential exclusion

  ========== REQUIRED SLOTS (HIGHEST PRIORITY) ==========
  
  These slots are CRITICAL and must be prioritized in follow-up questions:
  1. emotion (emotions experienced)
  2. duration (how long - MUST be specific, not vague like "lately")
  3. impact (how it affects life)
  4. intensity (intensity level)
  5. recent_life_events (CRITICAL: any major life events/stressors to differentiate stress vs disorder)

  ADDITIONAL IMPORTANT SLOTS:
  6. trigger (what caused/triggers the emotion)
  7. need (what they need: listening/advice/support/coping_strategies)
  8. stress_level (stress level)

  DIFFERENTIAL DIAGNOSIS SLOTS (CRITICAL FOR SAFETY):
  9. substance_use (alcohol/caffeine/drugs that might cause symptoms)
  10. medical_history (physical conditions: thyroid, heart issues, etc.)
  11. symptom_fluctuation (continuous or episodic)

  ⚠️ IMPORTANT: If any REQUIRED_SLOTS are missing and semantically relevant, they MUST be included in "relevant_missing_slots" and follow-up questions BEFORE any other slots.
  
  ⚠️ DIFFERENTIAL RULE: If user mentions physical symptoms (heart racing, headaches, etc.), you MUST ask about medical_history and substance_use to rule out physical causes before considering mental health disorders.

  ========== TASK ==========
  
  1. Extract all slots mentioned or clearly implied
  2. List ALL missing slots in "missing_slots"
  3. Filter to SEMANTICALLY RELEVANT missing slots in "relevant_missing_slots"
     **PRIORITY RULE**: Include missing REQUIRED_SLOTS first, then other relevant slots
  4. Generate natural follow-up questions ONLY for "relevant_missing_slots"
     **PRIORITY RULE**: Ask about REQUIRED_SLOTS first (1-3 questions max)
     **LANGUAGE RULE**: Follow-up questions MUST be in VIETNAMESE (Tiếng Việt)

  ========== CRITICAL: DURATION EXTRACTION RULES ==========
  
  **Duration is THE MOST IMPORTANT slot. Extract it carefully from ANY mention of time, even in long/noisy responses.**
  
  Common duration phrases in Vietnamese (ALWAYS extract these):
  - "một tuần nay", "tầm một tuần", "khoảng một tuần"
  - "hai tuần", "vài tuần", "mấy tuần"
  - "một tháng", "hai tháng", "mấy tháng"
  - "từ hôm qua", "từ tuần trước", "từ tháng trước"
  - "dạo này", "gần đây", "lately" (mark as vague but still extract)
  - "lâu rồi", "khá lâu", "đã lâu"
  - "từ khi..." (extract context after "từ khi")
  
  **EXTRACTION PRIORITY**: Even if the user's response contains multiple pieces of information (greetings, formalities, explanations), you MUST identify and extract ANY time-related phrase into the duration slot.
  
  **Example**:
  Input: "Dạ, chắc cũng mới tầm một tuần nay thôi bác sĩ, từ khi em bắt đầu phải chuẩn bị tài liệu cho buổi thuyết trình đó ạ."
  
  CORRECT extraction:
  - duration: "một tuần nay" (or "tầm một tuần" or "khoảng một tuần")
  - trigger: "chuẩn bị tài liệu cho buổi thuyết trình"
  
  WRONG: duration: null (keeping old value) ❌
  
  **ALWAYS UPDATE duration if a new time phrase is mentioned, even if duration already has a value from previous turns.**

  ========== RELEVANCE DETERMINATION ==========
  
  A missing slot is RELEVANT if:
  - Semantically related to mentioned topics (same domain/topic)
  - Logically connected (cause-effect, symptom-context, problem-impact)
  - Would naturally come up in a human conversation about this topic
  - Helps understand the core issue better
  - **HIGHEST PRIORITY**: It's in REQUIRED_SLOTS list

  A missing slot is NOT RELEVANT if:
  - From a completely different domain/topic
  - No logical connection to what was shared
  - Would feel out of place in the conversation
  - **EXCEPTION**: Even if not directly relevant, REQUIRED_SLOTS should still be asked if they relate to mental health context

  ========== SLOT DEFINITIONS ==========
  
  Extract these slots if mentioned or clearly implied (set to null/[] if not):

  # Core Emotional
  - emotion: List[str] - Emotions experienced
  - primary_mood: str - Overall mood state
  - intensity: str - Intensity level ("low", "medium", "high")
  - trigger: str - What caused/triggers the emotion
  - duration: str - How long it's been happening (BE SPECIFIC: reject vague terms like "lately", "dạo này")
  - impact: str - How it affects life (text description)
  - risk_level: str - Risk level ("unknown", "none", "low", "medium", "high") - default "unknown"
  - need: str - What they need ("listening", "advice", "support", "coping_strategies")

  # Physical & Functional
  - physical_symptoms: List[str] - Physical issues (⚠️ If present, MUST check medical_history)
  - sleep_quality: str - Sleep quality ("good", "fair", "poor", "insomnia")
  - sleep_duration: str - Sleep amount ("adequate", "insufficient", "excessive")
  - energy_level: str - Energy level ("high", "normal", "low", "very_low")
  - appetite_changes: str - Appetite ("normal", "decreased", "increased", "none")
  - daily_functioning: str - Daily life impact ("normal", "mild_impairment", "moderate", "severe")
  - work_school_impact: str - Impact on work/school ("none", "mild", "moderate", "severe", "unable")

  # Social & Support
  - support_system: str - Overall support ("strong", "moderate", "weak", "none")
  - family_support: str - Family support ("supportive", "neutral", "unsupportive", "conflict")
  - friend_support: str - Friend support ("available", "limited", "none")
  - social_isolation: bool - Feeling isolated? (true/false/null)
  - social_withdrawal: bool - Withdrawing from social activities? (true/false/null)

  # Coping & Resources
  - coping_mechanisms: List[str] - Coping strategies used
  - coping_effectiveness: str - How well coping works ("effective", "somewhat", "ineffective", "harmful")
  - current_stressors: List[str] - Current stressors
  - stress_level: str - Stress level ("low", "moderate", "high", "overwhelming")

  # Risk & Safety
  - suicidal_ideation: bool - Suicidal thoughts? (true/false/null)
  - self_harm_thoughts: bool - Self-harm thoughts? (true/false/null)

  # Treatment
  - current_treatment: bool - In treatment? (true/false/null)
  - medication: bool - Taking medication? (true/false/null)

  # ⚠️ DIFFERENTIAL DIAGNOSIS (CRITICAL - Prevents Misdiagnosis)
  - substance_use: str - Alcohol/caffeine/drug use that might cause symptoms
  - medical_history: str - Physical conditions (thyroid, heart, hormonal issues, etc.)
  - recent_life_events: str - Major life events (job loss, breakup, death, etc.) OR "không có biến cố lớn" if none reported - CRITICAL for differentiating stress/adjustment vs disorder
  - symptom_fluctuation: str - Pattern: continuous/episodic/triggered
  - history_of_trauma: str - Past traumatic experiences
  
  # Derived Fields (for system tracking, not asked directly)
  - diagnostic_confidence: str - "low", "medium", "high" (based on info completeness)
  - duration_certainty: str - "vague", "approximate", "specific"
  - potential_differentials: List[str] - Possible alternative diagnoses

  ========== OUTPUT FORMAT ==========
  
  {
    "slots": {
      "emotion": [],
      "primary_mood": null,
      "intensity": null,
      "trigger": null,
      "duration": null,
      "impact": null,
      "risk_level": "unknown",
      "need": null,
      "physical_symptoms": [],
      "sleep_quality": null,
      "sleep_duration": null,
      "energy_level": null,
      "appetite_changes": null,
      "daily_functioning": null,
      "work_school_impact": null,
      "support_system": null,
      "family_support": null,
      "friend_support": null,
      "social_isolation": null,
      "social_withdrawal": null,
      "coping_mechanisms": [],
      "coping_effectiveness": null,
      "current_stressors": [],
      "stress_level": null,
      "suicidal_ideation": null,
      "self_harm_thoughts": null,
      "current_treatment": null,
      "medication": null,
      "substance_use": null,
      "medical_history": null,
      "recent_life_events": null,
      "symptom_fluctuation": null,
      "history_of_trauma": null,
      "diagnostic_confidence": "low",
      "potential_differentials": [],
      "duration_certainty": "vague"
    },
    "missing_slots": [],              // ALL slots that are null/empty
    "relevant_missing_slots": [],     // Only semantically relevant missing slots (PRIORITIZE REQUIRED_SLOTS + DIFFERENTIAL)
    "follow_up_questions": []         // Only for relevant_missing_slots, 1-3 questions max (IN VIETNAMESE)
  }

  ========== GOLD EXAMPLES ==========

  EXAMPLE 1 - Work Anxiety (Fixed: Check for recent_life_events):
