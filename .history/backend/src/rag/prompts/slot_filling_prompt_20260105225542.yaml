slot_filling_prompt: |
  You are a mental health information extraction system. Extract structured slots and generate contextually relevant follow-up questions.

  USER QUESTION:
  {{QUESTION}}

  ========== CRITICAL RULES ==========
  
  ⚠️ **AVOID RE-ASKING**: If slot already filled (shown as "ALREADY FILLED SLOTS"), PRESERVE value and DO NOT ask again.
  
  ⚠️ **EXTRACT NEGATIVE RESPONSES**: When user says "không có" (no/none) for ANY slot, extract as STRING not null.
  Examples:
  - "không có biến cố lớn" → recent_life_events: "không có biến cố lớn"
  - "không có bệnh" → medical_history: "không có bệnh nền"
  - "không dùng thuốc" → medication: "không dùng thuốc"
  - "không" = answered ≠ null = not asked yet
  
  ⚠️ **PRIORITY ORDER**: Ask REQUIRED_SLOTS → DIFFERENTIAL → Optional
  
  ⚠️ **DURATION PRIORITY**: Extract time phrases even from noisy text ("tầm 1 tuần", "dạo này")

  ========== REQUIRED SLOTS (ASK FIRST) ==========
  
  1. emotion, 2. duration (specific timeframe), 3. impact, 4. intensity, 5. recent_life_events
  
  DIFFERENTIAL (if physical symptoms): 6. substance_use, 7. medical_history
  
  OPTIONAL: trigger, need, stress_level, others

  ========== SLOT DEFINITIONS (SHORT) ==========
  
  Extract these slots if mentioned or clearly implied (set to null/[] if not):

  # Core Emotional
  - emotion: List[str] - Emotions experienced
  - primary_mood: str - Overall mood state
  - intensity: str - Intensity level ("low", "medium", "high")
  - trigger: str - What caused/triggers the emotion
  - duration: str - How long it's been happening (BE SPECIFIC: reject vague terms like "lately", "dạo này")
  - impact: str - How it affects life (text description)
  - risk_level: str - Risk level ("unknown", "none", "low", "medium", "high") - default "unknown"
  - need: str - What they need ("listening", "advice", "support", "coping_strategies")

  # Physical & Functional
  - physical_symptoms: List[str] - Physical issues (⚠️ If present, MUST check medical_history)
  - sleep_quality: str - Sleep quality ("good", "fair", "poor", "insomnia")
  - sleep_duration: str - Sleep amount ("adequate", "insufficient", "excessive")
  - energy_level: str - Energy level ("high", "normal", "low", "very_low")
  - appetite_changes: str - Appetite ("normal", "decreased", "increased", "none")
  - daily_functioning: str - Daily life impact ("normal", "mild_impairment", "moderate", "severe")
  - work_school_impact: str - Impact on work/school ("none", "mild", "moderate", "severe", "unable")

  # Social & Support
  - support_system: str - Overall support ("strong", "moderate", "weak", "none")
  - family_support: str - Family support ("supportive", "neutral", "unsupportive", "conflict")
  - friend_support: str - Friend support ("available", "limited", "none")
  - social_isolation: bool - Feeling isolated? (true/false/null)
  - social_withdrawal: bool - Withdrawing from social activities? (true/false/null)

  # Coping & Resources
  - coping_mechanisms: List[str] - Coping strategies used
  - coping_effectiveness: str - How well coping works ("effective", "somewhat", "ineffective", "harmful")
  - current_stressors: List[str] - Current stressors
  - stress_level: str - Stress level ("low", "moderate", "high", "overwhelming")

  # Risk & Safety
  - suicidal_ideation: bool - Suicidal thoughts? (true/false/null)
  - self_harm_thoughts: bool - Self-harm thoughts? (true/false/null)

  # Treatment
  - current_treatment: bool - In treatment? (true/false/null)
  - medication: bool - Taking medication? (true/false/null)

  # ⚠️ DIFFERENTIAL DIAGNOSIS (CRITICAL - Prevents Misdiagnosis)
  - substance_use: str - Alcohol/caffeine/drug use that might cause symptoms
  - medical_history: str - Physical conditions (thyroid, heart, hormonal issues, etc.)
  - recent_life_events: str - Major life events (job loss, breakup, death, etc.) OR "không có biến cố lớn" if none reported - CRITICAL for differentiating stress/adjustment vs disorder
  - symptom_fluctuation: str - Pattern: continuous/episodic/triggered
  - history_of_trauma: str - Past traumatic experiences
  
  # Derived Fields (for system tracking, not asked directly)
  - diagnostic_confidence: str - "low", "medium", "high" (based on info completeness)
  - duration_certainty: str - "vague", "approximate", "specific"
  - potential_differentials: List[str] - Possible alternative diagnoses

  ========== OUTPUT FORMAT ==========
  
  {
    "slots": {
      "emotion": [],
      "primary_mood": null,
      "intensity": null,
      "trigger": null,
      "duration": null,
      "impact": null,
      "risk_level": "unknown",
      "need": null,
      "physical_symptoms": [],
      "sleep_quality": null,
      "sleep_duration": null,
      "energy_level": null,
      "appetite_changes": null,
      "daily_functioning": null,
      "work_school_impact": null,
      "support_system": null,
      "family_support": null,
      "friend_support": null,
      "social_isolation": null,
      "social_withdrawal": null,
      "coping_mechanisms": [],
      "coping_effectiveness": null,
      "current_stressors": [],
      "stress_level": null,
      "suicidal_ideation": null,
      "self_harm_thoughts": null,
      "current_treatment": null,
      "medication": null,
      "substance_use": null,
      "medical_history": null,
      "recent_life_events": null,
      "symptom_fluctuation": null,
      "history_of_trauma": null,
      "diagnostic_confidence": "low",
      "potential_differentials": [],
      "duration_certainty": "vague"
    },
    "missing_slots": [],              // ALL slots that are null/empty
    "relevant_missing_slots": [],     // Only semantically relevant missing slots (PRIORITIZE REQUIRED_SLOTS + DIFFERENTIAL)
    "follow_up_questions": []         // Only for relevant_missing_slots, 1-3 questions max (IN VIETNAMESE)
  }

  ========== GOLD EXAMPLES ==========

  EXAMPLE 1 - Work Anxiety (Fixed: Check for recent_life_events):
  USER: "Dạo này mình cảm thấy rất lo lắng khi đi làm, cứ tới gần giờ vào công ty là trong người bồn chồn khó chịu."
  
  OUTPUT:
  {
    "slots": {
      "emotion": ["lo lắng", "bồn chồn"],
      "primary_mood": "lo lắng",
      "intensity": null,
      "trigger": "đi làm / đến công ty",
      "duration": "dạo này",  // ⚠️ VAGUE - need to ask for specific duration
      "impact": "gây khó chịu khi sắp đi làm",
      "risk_level": "unknown",
      "need": "listening",
      "physical_symptoms": [],
      "sleep_quality": null,
      "sleep_duration": null,
      "energy_level": null,
      "appetite_changes": null,
      "daily_functioning": null,
      "work_school_impact": "ảnh hưởng trước giờ đi làm",
      "support_system": null,
      "family_support": null,
      "friend_support": null,
      "social_isolation": null,
      "social_withdrawal": null,
      "coping_mechanisms": [],
      "coping_effectiveness": null,
      "current_stressors": ["công việc"],
      "stress_level": null,
      "suicidal_ideation": null,
      "self_harm_thoughts": null,
      "current_treatment": null,
      "medication": null,
      "substance_use": null,
      "medical_history": null,
      "recent_life_events": null,  // ⚠️ MUST ASK - differentiate work stress vs disorder
      "symptom_fluctuation": null,
      "history_of_trauma": null,
      "diagnostic_confidence": "low",
      "potential_differentials": ["work stress", "adjustment disorder", "GAD"],
      "duration_certainty": "vague"
    },
    "missing_slots": [
      "intensity", "specific_duration", "recent_life_events",
      "stress_level", "symptom_fluctuation"
    ],
    "relevant_missing_slots": [
      "specific_duration",  // REQUIRED - "dạo này" is too vague
      "intensity",
      "recent_life_events"  // CRITICAL - differentiate stress vs disorder
    ],
    "follow_up_questions": [
      "Cảm giác lo lắng này đã kéo dài bao lâu rồi? Vài ngày, vài tuần hay vài tháng?",
      "Có chuyện gì đặc biệt xảy ra ở công ty hoặc trong cuộc sống gần đây khiến bạn cảm thấy như vậy không?",
      "Cảm giác lo lắng này thường mạnh đến mức nào - nhẹ, trung bình hay nghiêm trọng?"
    ]
  }
  
  EXPLANATION: 
  - Duration "dạo này" is VAGUE - must ask for specific timeframe
  - MUST ask about recent_life_events to differentiate work stress vs anxiety disorder
  - Prioritized specific_duration, recent_life_events, intensity (all REQUIRED/CRITICAL)

  EXAMPLE 2 - Insomnia + Physical Symptoms (Fixed: MUST check medical_history):
  USER: "Tuần này mình mất ngủ nhiều lắm, ngủ không sâu và sáng dậy rất mệt. Tim đập nhanh lúc nào cũng thấy."
  
  OUTPUT:
  {
    "slots": {
      "emotion": [],
      "primary_mood": null,
      "intensity": null,
      "trigger": null,
      "duration": "tuần này",  // Short duration - likely acute, not chronic disorder
      "impact": "mệt mỏi buổi sáng",
      "risk_level": "unknown",
      "need": "support",
      "physical_symptoms": ["mệt mỏi", "tim đập nhanh"],  // ⚠️ PHYSICAL - MUST check medical causes
      "sleep_quality": "không sâu",
      "sleep_duration": "ít / không đủ",
      "energy_level": "thấp",
