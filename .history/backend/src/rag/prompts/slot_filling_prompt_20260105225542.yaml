    },
    "missing_slots": [
      "medical_history", "substance_use", "recent_life_events",
      "stress_level", "intensity"
    ],
    "relevant_missing_slots": [
      "medical_history",  // CRITICAL - rule out thyroid, heart issues
      "substance_use",    // CRITICAL - caffeine can cause these symptoms
      "recent_life_events"
    ],
    "follow_up_questions": [
      "Bạn có đang dùng caffeine (cà phê, trà, nước tăng lực) nhiều không? Hoặc có dùng thuốc gì đặc biệt không?",
      "Bạn có tiền sử về bệnh tuyến giáp, tim mạch hoặc bất kỳ vấn đề sức khỏe nào không?",
      "Có chuyện gì căng thẳng xảy ra trong tuần này khiến bạn mất ngủ không?"
    ]
  }
  
  EXPLANATION:
  - Physical symptoms (heart racing) present - MUST check medical_history & substance_use FIRST
  - Could be hyperthyroidism, caffeine excess, NOT just anxiety
  - Duration only "tuần này" (1 week) - too short for disorder diagnosis
  - Prioritized differential exclusion before considering mental health causes

  EXAMPLE 2b - User Says "No Major Events" (Extract as string, not null):
  USER: "Không có biến cố gì quá lớn, chủ yếu là công việc dồn và em ngủ ít hơn bình thường."
  
  OUTPUT:
  {
    "slots": {
      ...
      "recent_life_events": "không có biến cố lớn, công việc dồn và ngủ ít",  // ⭐ EXTRACT even when "no major events"
      "current_stressors": ["công việc dồn", "thiếu ngủ"],
      ...
    },
    "missing_slots": [...],  // recent_life_events NOT in missing because it was answered
    "relevant_missing_slots": [...],  // Do NOT include recent_life_events
    "follow_up_questions": [...]  // Do NOT ask about recent_life_events again
  }
  
  EXPLANATION:
  - ⭐ CRITICAL: When user says "no major events" or "không có biến cố lớn", extract it as a STRING value
  - This ANSWERS the question - user confirmed no major life events
  - Setting to null would make system ask again!
  - Extract work stress as current_stressors instead

