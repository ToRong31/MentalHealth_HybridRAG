# Response Templates for Mental Health Chatbot
# Vietnamese language

crisis_response: |
  Tôi nghe được rằng bạn đang trải qua khoảng thời gian rất đau khổ, và tôi muốn bạn biết rằng bạn không phải đối mặt với điều này một mình.
  
  Những gì bạn đang cảm thấy rất quan trọng, và có những người được đào tạo chuyên môn để giúp bạn vượt qua khủng hoảng này. Xin hãy liên hệ với một trong những nguồn hỗ trợ sau ngay lập tức:
  
  - **Đường dây nóng Sức khỏe Tâm thần:** 1800 599 199 (miễn phí, 24/7)
  - **Trung tâm Chăm sóc Sức khỏe Tâm thần Cộng đồng** gần nhất với bạn
  - **Nếu bạn đang ở trong tình huống nguy hiểm:** Hãy gọi 115 hoặc đến phòng cấp cứu gần nhất
  
  Bạn xứng đáng được hỗ trợ, và những dịch vụ này có mặt ở đây dành riêng cho những lúc như thế này. Bạn có thể liên hệ với một trong số họ ngay bây giờ được không?

not_mental_health_response: |
  Cảm ơn bạn đã đặt câu hỏi. Tôi được thiết kế đặc biệt để hỗ trợ các vấn đề về sức khỏe tâm thần và cảm xúc.
  
  Câu hỏi của bạn có vẻ nằm ngoài lĩnh vực chuyên môn của tôi. Để được tư vấn tốt nhất về chủ đề này, tôi khuyến nghị bạn nên kết nối với người có chuyên môn trong lĩnh vực đó.
  
  Nếu bạn có bất kỳ câu hỏi nào liên quan đến căng thẳng, lo âu, tâm trạng, hoặc những thách thức về cảm xúc, tôi luôn sẵn sàng hỗ trợ bạn.

fallback_answer: |
  Tôi hiểu rằng bạn đang tìm kiếm sự hỗ trợ, và tôi thực sự muốn giúp đỡ bạn.
  
  Tôi đang gặp một số khó khăn kỹ thuật lúc này, nhưng từ những gì tôi có thể thấy, có một số phương pháp có thể hữu ích - bao gồm các kỹ thuật giảm căng thẳng, bài tập thở sâu, và các chiến lược thư giãn.
  
  Bạn có thể chia sẻ thêm một chút về những gì bạn đang trải qua được không? Như vậy, khi tôi có thể phản hồi đầy đủ hơn, tôi sẽ có thể đưa ra hướng dẫn cụ thể hơn cho tình huống của bạn.

fallback_answer_hybrid: |
  Tôi muốn ở đây để hỗ trợ bạn trong thời điểm khó khăn này.
  
  Tôi đang gặp một số vấn đề kỹ thuật, nhưng tôi có thể thấy có thông tin hữu ích cho tình huống của bạn.
  
  Bạn có thể chia sẻ thêm về những gì bạn đang trải qua không? Tôi muốn đảm bảo rằng tôi hiểu đầy đủ để có thể đưa ra sự hỗ trợ phù hợp nhất.

# Additional helper messages
clarification_needed: |
  Để tôi có thể hỗ trợ bạn tốt nhất, bạn có thể chia sẻ thêm chi tiết về tình huống của bạn không? Điều đó sẽ giúp tôi đưa ra hướng dẫn phù hợp nhất cho bạn.

insufficient_knowledge: |
  Dựa trên thông tin hiện có, tôi chưa có đủ kiến thức để đưa ra câu trả lời ý nghĩa. Bạn có thể cung cấp thêm chi tiết về tình huống của mình không?

