    ]
  }
  
  EXPLANATION: 
  - Prioritized "intensity" and "stress_level" (REQUIRED_SLOTS) over other slots
  - Even though "coping_mechanisms" is relevant, we ask about REQUIRED_SLOTS first
  - Limited to 2 questions focusing on completing the required information

