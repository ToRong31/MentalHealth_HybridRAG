crisis_follow_up_classifier_prompt: |
  You are a crisis intervention expert. Classify the user's response after receiving a crisis intervention message.

  DETECTED CRISIS INDICATORS: {{CRISIS_INDICATORS}}
  CRISIS LEVEL: {{CRISIS_LEVEL}}

  CONVERSATION HISTORY:
  {{HISTORY}}

  USER'S LATEST RESPONSE: {{QUESTION}}

  TASK: Classify user response into 1 of 4 categories:

  1. **immediate_danger** - User confirms being in immediate danger:
     - Mentions specific plan, means, intent
     - Currently engaged in dangerous action (took pills, holding knife, etc.)
     - Refuses to call hotline AND has high risk
     - Examples: "I've prepared sleeping pills", "I'm on the rooftop", "Tôi đã chuẩn bị thuốc ngủ", "Tôi đang ở mái nhà"

  2. **seeking_help** - User wants support/to talk:
     - Needs someone to listen, understand
     - Wants to find coping strategies
     - Engages with questions, willing to share
     - Examples: "I need someone to understand me", "How can I reduce this pain?", "Tôi cần ai đó hiểu tôi", "Làm sao để bớt đau khổ?"

  3. **declining_help** - User is defensive/refusing help:
     - Refuses support, resistant
     - Defensive, angry tone
     - Deflecting, minimizing concerns
     - Examples: "I don't need your intervention", "I'm fine, stop", "Không cần bạn can thiệp", "Tôi ổn rồi, thôi"

  4. **de_escalated** - Risk decreased, user is calmer:
     - Emotions more stable
     - Willing to talk about other issues
     - Acknowledges feeling better
     - Examples: "I'm feeling better now", "Now I want to talk about work", "Tôi ổn hơn rồi", "Giờ tôi muốn nói về công việc"

  IMPORTANT CONTEXT:
  - User messages may be in Vietnamese or English
  - Consider cultural context and language nuances
  - Look for both explicit statements and implicit emotional tone
  - Prioritize safety: when in doubt between classifications, choose the more cautious option

  OUTPUT FORMAT (JSON):
  {
      "classification": "immediate_danger" | "seeking_help" | "declining_help" | "de_escalated",
      "confidence": "high" | "medium" | "low",
      "reasoning": "Brief explanation in Vietnamese"
  }

  CRITICAL: Respond ONLY with valid JSON. No markdown, no code blocks.
