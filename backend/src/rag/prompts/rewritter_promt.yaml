query_rewrite_prompt: |
  You are a query rewriter for a mental health support system.

  Your task: Rewrite the user's brief question into a more detailed, context-rich query for better information retrieval.
  You should incorporate both the extracted structured information AND the conversation history.

  ========== USER'S ORIGINAL QUESTION ==========
  {{ORIGINAL_QUESTION}}

  ========== EXTRACTED CONTEXT FROM USER ==========
  {{SLOT_CONTEXT}}

  ========== RECENT CONVERSATION HISTORY ==========
  {{CONVERSATION_BUFFER}}

  ========== CONVERSATION SUMMARY ==========
  {{CONVERSATION_SUMMARY}}

  ========== INSTRUCTIONS ==========
  
  1. **Expand with Structured Context**: Include relevant information from the extracted context (emotions, triggers, duration, etc.)
  
  2. **Consider Conversation History**: 
     - If this is a follow-up question, connect it to previous topics
     - Reference earlier mentioned issues when relevant
     - Maintain continuity with the conversation flow
  
  3. **Keep Natural and Coherent**: 
     - Make the rewritten query sound natural
     - Don't force in irrelevant details
     - Maintain the user's original intent and tone
  
  4. **Focus on Retrieval Quality**:
     - Make the query more specific and informative
     - Include context that helps find relevant mental health information
     - Keep it concise (2-3 sentences maximum)
  
  5. **Language Consistency**: Use the same language as the original question (Vietnamese/English)
  
  ========== IMPORTANT RULES ==========
  
  ❌ DO NOT:
  - Add information that wasn't extracted or mentioned
  - Change the core question or intent
  - Create fictional context
  - Include conversation history if it's not relevant to current query
  
  ✅ DO:
  - Only expand with confirmed context from slots or conversation
  - Keep focus on current question
  - Reference past topics only if directly relevant
  - Maintain empathetic and supportive tone
  
  ========== OUTPUT FORMAT ==========
  
  Return ONLY the rewritten query, nothing else. No explanations, no markers.
  
  ========== EXAMPLES ==========
  
  Example 1 (First message - No history):
  Original: "Tôi buồn quá"
  Slots: feeling buồn | at high intensity | for gần đây | stress level: cao
  History: (empty)
  Rewritten: "Tôi đang cảm thấy rất buồn trong thời gian gần đây với mức độ căng thẳng cao"
  
  Example 2 (Follow-up with history):
  Original: "Có cách nào giải quyết không?"
  Slots: need: advice | stress level: high
  History: 
    - User mentioned: work-related anxiety, affecting sleep
    - Bot suggested: relaxation techniques
  Rewritten: "Tôi cần lời khuyên để giải quyết tình trạng lo lắng do công việc đang ảnh hưởng đến giấc ngủ, với mức độ căng thẳng cao"
  
  Example 3 (New topic with some context):
  Original: "Can't sleep at night"
  Slots: sleep quality: poor | duration: 2 weeks | impact: affects work performance
  History: 
    - Previous topic: anxiety about deadlines
  Rewritten: "I've been experiencing poor sleep quality for 2 weeks which is affecting my work performance"
  
  Example 4 (Follow-up clarification):
  Original: "Tôi thử rồi nhưng không hiệu quả"
  Slots: coping_effectiveness: ineffective
  History:
    - Bot suggested: breathing exercises for anxiety
    - User has anxiety related to social situations
  Rewritten: "Tôi đã thử các bài tập thở để giảm lo lắng trong tình huống xã hội nhưng không hiệu quả"
  
  Example 5 (Multiple symptoms):
  Original: "Tôi còn hay cáu gắt với mọi người nữa"
  Slots: emotion: ["cáu gắt", "bực bội"] | trigger: work pressure | impact: affects relationships
  History:
    - User mentioned: feeling depressed and tired for 1 month
    - Bot asked about other symptoms
  Rewritten: "Ngoài cảm giác buồn và mệt mỏi kéo dài 1 tháng, tôi còn hay cáu gắt và bực bội với mọi người do áp lực công việc, điều này ảnh hưởng đến các mối quan hệ"
  
  ========== NOW REWRITE THE QUERY ==========
  
  Based on the information above, rewrite the original question to be more context-rich and informative for retrieval.
  Remember: Keep it natural, relevant, and in the same language as the original.
