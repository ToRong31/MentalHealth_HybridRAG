# syntax=docker/dockerfile:1.6
version: "3.9"

networks:
  mental_health_network:
    external: true

volumes:
  hf_cache:
    name: hf_cache

services:
  supervisor:
    build:
      context: ../..
      dockerfile: ai/agents/supervisor/Dockerfile
    container_name: ai-supervisor
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - AGENT_NAME=supervisor
      - AGENT_PORT=8001
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kguser2005}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-mental_health_db}
      - PYTHONUNBUFFERED=1
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - mental_health_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  memory:
    build:
      context: ../..
      dockerfile: ai/agents/memory/Dockerfile
    container_name: ai-memory
