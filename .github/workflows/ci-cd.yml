name: CI/CD — MentalHealth Hybrid RAG

on:
  push:
    branches: [main, init_refactor_to_multiagent_system]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff mypy black

      - name: Run ruff
        run: |
          ruff check ai/ backend/src/ --output-format=github

      - name: Run black (check only)
        run: |
          black --check ai/ backend/src/ --exclude='/(\.venv|\.git|\.mypy_cache|__pycache__)/'

      - name: Run mypy
        run: |
          mypy ai/ backend/src/ --ignore-missing-imports || true

  # ── Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          pytest backend/tests/unit/ \
            -v \
            --tb=short \
            --cov=ai \
            --cov-report=xml \
            --cov-report=html \
            -W ignore::DeprecationWarning

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run integration tests
        run: |
          pytest backend/tests/integration/ \
            -v \
            --tb=short \
            -W ignore::DeprecationWarning

  # ── Docker Build ────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (Agents + Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI agents Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai/Dockerfile
          push: false
          tags: mental-health-agents:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: mental-health-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── All checks passed ───────────────────────────────────────────────────
  success:
    name: ✅ All checks passed
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, docker-build]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "CI/CD pipeline completed successfully"
